<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Archivo:wdth,wght@62..125,300..900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="./responsive.css">
<style>
body{margin:0}
</style>
</helmet>
<header style="background: rgba(5,4,9,0.88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.09); font-family: Inter, system-ui, sans-serif; color: #F4F2F8; position: relative; z-index: 30">
<div class="hdr-row" style="max-width: 1180px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 4px 20px; flex-wrap: nowrap">
<a href="Main.dc.html" aria-label="TheMinds, početna" style="flex: none; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 900; font-size: 22px; letter-spacing: -0.01em; text-decoration: none; color: #FFFFFF; min-height: 44px; display: inline-flex; align-items: center">TheMinds</a>
<nav id="hdr-nav" class="{{navCls}}" aria-label="Glavna navigacija">
<sc-for list="{{items}}" as="n" hint-placeholder-count="5"><a href="{{n.href}}" target="{{n.target}}" rel="{{n.rel}}" aria-current="{{n.current}}" style="{{n.style}}">{{n.label}}</a></sc-for>
</nav>
<div style="flex: none; display: flex; align-items: center; gap: 8px">
<a href="Checkout.dc.html" class="hdr-cta" style="display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(100deg,#FF4D8D,#8B5CF6); color: #FFFFFF; text-decoration: none; font-family: Archivo, sans-serif; font-stretch: 115%; font-weight: 800; font-size: 12.5px; letter-spacing: 0.08em; box-shadow: 0 8px 24px -8px rgba(255,77,141,0.6); text-transform: uppercase; padding: 0 20px; min-height: 44px; border-radius: 999px">Poruči</a>
<button type="button" class="hdr-burger" aria-controls="hdr-nav" aria-expanded="{{open}}" aria-label="{{burgerLabel}}" onClick="{{toggle}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="{{burgerPath}}"></path></svg>
</button>
</div>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","b2b","prica","posiljka","kontakt"],"default":"home"},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: false };
  }
  renderVals() {
    var self = this;
    var open = this.state.open;
    var active = this.props.active || 'home';
    var base = 'text-decoration: none; font-size: 12.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; box-sizing: border-box; border-bottom: 2px solid ';
    var defs = [
      { id: 'home', label: 'Zynamik® Direct', href: 'Main.dc.html' },
      { id: 'b2b', label: 'B2B', href: 'B2B.dc.html' },
      { id: 'prica', label: 'Naša priča', href: 'NasaPrica.dc.html' },
      { id: 'posiljka', label: 'Prati pošiljku', href: 'PratiPosiljku.dc.html' },
      { id: 'kontakt', label: 'Kontakt', href: 'Kontakt.dc.html' }
    ];
    return {
      open: open ? 'true' : 'false',
      navCls: 'hdr-nav' + (open ? ' is-open' : ''),
      burgerLabel: open ? 'Zatvori meni' : 'Otvori meni',
      burgerPath: open ? 'M6 6l12 12M18 6L6 18' : 'M4 7h16M4 12h16M4 17h16',
      toggle: function () { self.setState({ open: !self.state.open }); },
      items: defs.map(function (d) {
        var on = d.id === active;
        return {
          label: d.label,
          href: d.href,
          target: '_self',
          rel: '',
          current: on ? 'page' : 'false',
          style: base + (on ? '#FF4D8D; color: #FFFFFF;' : 'transparent; color: #A9A5B8;')
        };
      })
    };
  }
}
</script>
</body>
</html>
